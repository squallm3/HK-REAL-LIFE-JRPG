<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Odisea de los Haikus Gnósticos</title>
<link rel="stylesheet" href="styles.css">
<script src="niveles.js"></script>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="app">
  <header>
    <div class="header-pixel-frame">
      <span class="medallion">🦊</span>
      <h1>La Odisea de los Haikus Gnósticos</h1>
      <div class="subtitle">Registro de tareas &bull; Director: VALIS</div>
    </div>
  </header>

  <div class="rune-line"></div>

  <div id="state-panel" role="button" tabindex="0" onclick="abrirModalEstado()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();abrirModalEstado();}">
    <div id="state-row">
      <span id="state-level">Nivel 1</span>
      <span id="state-xp">0 XP</span>
    </div>
    <div id="state-title">Iniciado de la Grieta</div>
    <div id="xp-bar-track"><div id="xp-bar-fill" style="width:0%"></div></div>
    <div id="xp-bar-label"></div>
  </div>

  <div id="save-panel">
    <div class="save-row">
      <button class="send-btn" onclick="exportarPartida()" title="Descargar partida">💾</button>
      <label class="send-btn" for="import-file-input" title="Cargar partida" style="cursor:pointer;">📂</label>
      <input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="importarPartidaArchivo(event)">
      <span id="save-status"></span>
    </div>
  </div>

  <div class="rune-line"></div>

  <div id="input-area">
    <div class="input-row">
      <select id="xp-select">
        <option value="111">+111</option>
        <option value="333">+333</option>
        <option value="777">+777</option>
        <option value="1111">+1111</option>
        <option value="2222">+2222</option>
      </select>
      <input
        type="text"
        id="task-desc-input"
        placeholder="Descripción de la tarea (opcional, Enter para enviar)"
      />
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Enviar">⚔</button>
    </div>
    <div id="controls">
      <span id="char-count">0 caracteres</span>
      <span style="color:var(--text-dim);font-size:10px;letter-spacing:1px;">ENTER = ENVIAR</span>
    </div>
  </div>

  <div id="chat-window" class="pixel-border">
    <div id="messages">
      <div id="empty-state">
        <div class="big-rune">🌿</div>
        <p>
          Registrá tu primera tarea, viajero...<br><br>
          <span style="color:var(--gold-dim)">VALIS está esperando.</span>
        </p>
      </div>
    </div>
  </div>

  <div class="rune-line"></div>

  <div id="password-panel">
    <div class="password-row">
      <input type="text" id="password-input" placeholder="Contraseña de un nivel..." />
      <button class="send-btn" id="password-btn" onclick="probarPassword()" title="Ingresar">🔑</button>
    </div>
    <div id="password-status"></div>
  </div>

  <footer>La Odisea de los Haikus Gnósticos &mdash; 100% offline</footer>
</div>

<div id="estado-modal-overlay" class="modal-overlay hidden" onclick="cerrarModalEstadoOverlay(event)">
  <div class="modal-box modal-box-wide" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cerrarModalEstado()" aria-label="Cerrar">✕</button>
    <h2 id="modal-titulo-nivel" class="modal-titulo"></h2>
    <div class="modal-columnas">
      <div class="modal-columna">
        <p class="modal-columna-label">Personaje</p>
        <div id="modal-personaje-actual"></div>
        <div class="modal-divider"></div>
        <div id="modal-personaje-historico" class="modal-columna-scroll"></div>
      </div>
      <div class="modal-columna">
        <p class="modal-columna-label">Artefacto</p>
        <div id="modal-artefacto-actual"></div>
        <div class="modal-divider"></div>
        <div id="modal-artefacto-historico" class="modal-columna-scroll"></div>
      </div>
    </div>
  </div>
</div>

<div id="lightbox-overlay" class="modal-overlay hidden" onclick="cerrarLightbox()">
  <img id="lightbox-img" src="" alt="" class="lightbox-img">
</div>

<script src="fragmentos.js"></script>
<script src="motor.js"></script>
</body>
</html>
