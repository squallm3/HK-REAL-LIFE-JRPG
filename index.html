<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Odisea de los Haikus Gnósticos</title>
<script src="niveles.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');

  :root {
    --gold: #c9a84c;
    --gold-bright: #f0c040;
    --gold-dim: #7a5f1a;
    --red: #8b1a1a;
    --red-bright: #c0392b;
    --dark: #0a0806;
    --dark2: #110e08;
    --dark3: #1a1508;
    --parchment: #2a2010;
    --green-magic: #2aff8f;
    --green-dim: #0a4a2a;
    --text-body: #d4b896;
    --text-dim: #7a6040;
    --pixel: 2px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text-body);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(201,168,76,0.015) 3px, rgba(201,168,76,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(201,168,76,0.01) 3px, rgba(201,168,76,0.01) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--gold);
    image-rendering: pixelated;
    animation: twinkle var(--d, 3s) var(--delay, 0s) infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.1; }
    100% { opacity: 0.7; }
  }

  .rune-line {
    height: 4px;
    background: repeating-linear-gradient(90deg,
      var(--gold) 0px, var(--gold) 4px,
      transparent 4px, transparent 8px,
      var(--gold-bright) 8px, var(--gold-bright) 10px,
      transparent 10px, transparent 16px
    );
    opacity: 0.6;
  }

  #app {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 12px 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 24px 0 12px;
    position: relative;
  }

  .header-pixel-frame {
    display: inline-block;
    position: relative;
    padding: 16px 40px;
  }

  .header-pixel-frame::before,
  .header-pixel-frame::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    background:
      linear-gradient(var(--gold) 2px, transparent 2px) 0 0 / 2px 100%,
      linear-gradient(var(--gold) 2px, transparent 2px) 0 0 / 100% 2px,
      linear-gradient(var(--gold) 2px, transparent 2px) calc(100% - 2px) 0 / 2px 6px,
      linear-gradient(var(--gold) 2px, transparent 2px) 0 calc(100% - 2px) / 6px 2px;
    background-repeat: no-repeat;
  }
  .header-pixel-frame::before { top: 0; left: 0; }
  .header-pixel-frame::after { bottom: 0; right: 0; transform: rotate(180deg); }

  .medallion {
    font-size: 48px;
    display: block;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.8));
    animation: medallion-glow 3s ease-in-out infinite alternate;
  }
  @keyframes medallion-glow {
    0% { filter: drop-shadow(0 0 4px rgba(201,168,76,0.4)); }
    100% { filter: drop-shadow(0 0 14px rgba(201,168,76,1)) drop-shadow(0 0 28px rgba(42,255,143,0.3)); }
  }

  h1 {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 26px;
    color: var(--gold-bright);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(201,168,76,0.6), 0 2px 0 rgba(0,0,0,0.8);
    line-height: 1.2;
  }
  .subtitle {
    font-size: 11px;
    color: var(--gold-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  #state-panel {
    background: var(--dark2);
    border: 2px solid var(--gold-dim);
    padding: 14px 16px;
    margin: 8px 0;
    position: relative;
  }
  #state-panel::before {
    content: '⚜ ESTADO DE LA PARTIDA';
    position: absolute;
    top: -10px;
    left: 16px;
    background: var(--dark2);
    padding: 0 8px;
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 2px;
  }
  #state-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--gold-dim);
    letter-spacing: 1px;
  }
  #state-title {
    font-size: 14px;
    color: var(--gold-bright);
    margin-bottom: 8px;
  }
  #xp-bar-track {
    height: 8px;
    background: var(--dark);
    border: 1px solid var(--gold-dim);
    position: relative;
    overflow: hidden;
  }
  #xp-bar-fill {
    height: 100%;
    background: var(--green-magic);
    box-shadow: 0 0 8px var(--green-magic);
    transition: width 0.4s ease-out;
  }
  #xp-bar-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: 4px;
    text-align: right;
  }

  #chat-window {
    flex: 1;
    background: var(--dark2);
    border: 2px solid var(--gold-dim);
    position: relative;
    overflow: hidden;
    min-height: 420px;
    margin: 4px 0;
  }
  #chat-window::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(201,168,76,0.1);
    pointer-events: none;
    z-index: 2;
  }

  #messages {
    height: 420px;
    overflow-y: auto;
    padding: 16px 16px 8px;
    scroll-behavior: smooth;
    position: relative;
    z-index: 1;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: var(--dark); }
  #messages::-webkit-scrollbar-thumb { background: var(--gold-dim); }

  .msg {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    animation: msg-appear 0.3s ease-out;
  }
  @keyframes msg-appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.jugador { flex-direction: row-reverse; }

  .avatar {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    image-rendering: pixelated;
    position: relative;
  }
  .avatar canvas {
    width: 40px;
    height: 40px;
    image-rendering: pixelated;
  }

  .bubble {
    max-width: 68%;
    position: relative;
  }

  .sender-name {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--gold-dim);
  }
  .msg.valis .sender-name { color: #c04090; }
  .msg.jugador .sender-name { text-align: right; color: var(--gold); }

  .bubble-inner {
    background: var(--dark3);
    border: 2px solid var(--gold-dim);
    padding: 10px 13px;
    line-height: 1.6;
    color: var(--text-body);
    position: relative;
  }
  .msg.valis .bubble-inner {
    border-color: #601040;
    border-left: 4px solid #c04090;
    background: linear-gradient(135deg, #1a0812 0%, var(--dark3) 100%);
  }
  .msg.jugador .bubble-inner {
    border-color: var(--gold-dim);
    border-right: 4px solid var(--gold);
    background: linear-gradient(225deg, #1a1508 0%, var(--dark3) 100%);
    text-align: right;
  }

  .fragmento-text {
    color: var(--text-body);
    font-style: italic;
    font-size: 12px;
    line-height: 1.6;
  }

  .xp-gain-text {
    color: var(--green-magic);
    font-size: 13px;
    margin-bottom: 8px;
  }

  .msg.valis .bubble-inner::after {
    content: '✦';
    position: absolute;
    top: 6px;
    right: 8px;
    color: rgba(192,64,144,0.4);
    font-size: 10px;
    animation: sparkle 2s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%,100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .levelup-block {
    background: linear-gradient(135deg, #0a2a1a 0%, var(--dark3) 100%);
    border: 2px solid var(--green-dim);
    border-left: 4px solid var(--green-magic);
    padding: 12px 14px;
    margin: 10px 0 18px;
  }
  .levelup-header {
    color: var(--green-magic);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .levelup-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
    color: var(--text-body);
  }
  .levelup-row span:first-child { color: var(--text-dim); }
  .levelup-row .pw { color: var(--gold-bright); font-family: monospace; }

  .error-block {
    background: linear-gradient(135deg, #2a0a0a 0%, var(--dark3) 100%);
    border: 2px solid var(--red);
    border-left: 4px solid var(--red-bright);
    padding: 10px 13px;
    margin-bottom: 18px;
    color: #f0a0a0;
    font-size: 12px;
  }

  #input-area {
    background: var(--dark2);
    border: 2px solid var(--gold-dim);
    border-top: none;
    padding: 12px;
    position: relative;
  }
  #input-area::before {
    content: '⚔ JUGADOR ⚔';
    position: absolute;
    top: -10px;
    right: 16px;
    background: var(--dark2);
    padding: 0 8px;
    color: var(--gold-dim);
    font-size: 10px;
    letter-spacing: 2px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    background: var(--dark);
    border: 2px solid var(--gold-dim);
    color: var(--text-body);
    padding: 10px 12px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: var(--gold); }
  #user-input::placeholder { color: var(--text-dim); }

  .send-btn {
    background: var(--dark);
    border: 2px solid var(--gold);
    color: var(--gold);
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    image-rendering: pixelated;
    flex-shrink: 0;
  }
  .send-btn:hover {
    background: var(--gold);
    color: var(--dark);
    box-shadow: 0 0 12px rgba(201,168,76,0.6);
  }

  #controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0 4px;
  }
  #char-count {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 40px;
    text-align: center;
    opacity: 0.6;
  }
  #empty-state .big-rune {
    font-size: 48px;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite alternate;
  }
  @keyframes float {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }
  #empty-state p {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
    line-height: 1.8;
  }

  footer {
    text-align: center;
    padding: 8px 0;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .pixel-border {
    box-shadow:
      2px 0 0 var(--gold-dim),
      -2px 0 0 var(--gold-dim),
      0 2px 0 var(--gold-dim),
      0 -2px 0 var(--gold-dim),
      4px 4px 0 rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="app">
  <header>
    <div class="header-pixel-frame">
      <span class="medallion">🦊</span>
      <h1>La Odisea de los Haikus Gnósticos</h1>
      <div class="subtitle">Registro de tareas &bull; Director: VALIS</div>
    </div>
  </header>

  <div class="rune-line"></div>

  <div id="state-panel">
    <div id="state-row">
      <span id="state-level">Nivel 1</span>
      <span id="state-xp">0 XP</span>
    </div>
    <div id="state-title">Iniciado de la Grieta</div>
    <div id="xp-bar-track"><div id="xp-bar-fill" style="width:0%"></div></div>
    <div id="xp-bar-label"></div>
  </div>

  <div class="rune-line"></div>

  <div id="chat-window" class="pixel-border">
    <div id="messages">
      <div id="empty-state">
        <div class="big-rune">🌿</div>
        <p>
          Registrá tu primera tarea, viajero...<br><br>
          <span style="color:var(--gold-dim)">VALIS está esperando.</span>
        </p>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="+50 por lavar los platos (Enter para enviar)"
        rows="1"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Enviar">⚔</button>
    </div>
    <div id="controls">
      <span id="char-count">0 caracteres</span>
      <span style="color:var(--text-dim);font-size:10px;letter-spacing:1px;">ENTER = ENVIAR &bull; SHIFT+ENTER = NUEVA LÍNEA</span>
    </div>
  </div>

  <footer>La Odisea de los Haikus Gnósticos &mdash; 100% offline</footer>
</div>

<script>

// ── PIXEL STARS ──
(function() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--d', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--delay', (-Math.random() * 4) + 's');
    s.style.opacity = Math.random() * 0.5;
    container.appendChild(s);
  }
})();

// ── AVATARES PIXEL ART (placeholder hasta tener las imágenes reales) ──
function drawJugadorAvatar(canvas) {
  const ctx = canvas.getContext('2d');
  const S = 10;
  canvas.width = 4 * S;
  canvas.height = 4 * S;
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(S, 0, 2*S, S);
  ctx.fillStyle = '#c09060';
  ctx.fillRect(S, S, 2*S, S);
  ctx.fillStyle = '#c9a84c';
  ctx.fillRect(S, S, S/2, S/2);
  ctx.fillRect(2*S+S/2, S, S/2, S/2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 2*S, 4*S, S);
  ctx.fillStyle = '#c9a84c';
  ctx.fillRect(S+S/4, 2*S+S/4, S/2, S/2);
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(S/2, 3*S, S, S);
  ctx.fillRect(2*S+S/2, 3*S, S, S);
}

function drawValisAvatar(canvas) {
  const ctx = canvas.getContext('2d');
  const S = 10;
  canvas.width = 4 * S;
  canvas.height = 4 * S;
  // orejas
  ctx.fillStyle = '#8a4fc9';
  ctx.fillRect(S/2, 0, S, S/2);
  ctx.fillRect(2*S+S/2, 0, S, S/2);
  // cabeza
  ctx.fillStyle = '#a873e0';
  ctx.fillRect(S, S/2, 2*S, S+S/2);
  // hocico
  ctx.fillStyle = '#f5f0ff';
  ctx.fillRect(S+S/4, S+S/2, S+S/2, S);
  // ojos
  ctx.fillStyle = '#2a1a40';
  ctx.fillRect(S+S/4, S, S/4, S/4);
  ctx.fillRect(2*S+S/2, S, S/4, S/4);
  // toga/capucha
  ctx.fillStyle = '#601a8f';
  ctx.fillRect(0, 2*S, 4*S, 2*S);
  // ribete dorado
  ctx.fillStyle = '#c9a84c';
  ctx.fillRect(S/2, 2*S, 3*S, S/4);
}

// ── MOTOR: dado un total de XP, devuelve el nivel correspondiente ──
// (LEVELS viene de niveles.js, cargado antes que este script)
function findLevelByXp(totalXp) {
  let current = LEVELS[0];
  for (const lvl of LEVELS) {
    if (totalXp >= lvl.xp) current = lvl;
    else break;
  }
  return current;
}

function nextLevel(levelNumber) {
  return LEVELS.find(l => l.n === levelNumber + 1) || null;
}

function levelsCrossed(xpBefore, xpAfter) {
  const before = findLevelByXp(xpBefore).n;
  const after = findLevelByXp(xpAfter).n;
  const crossed = [];
  for (let n = before + 1; n <= after; n++) {
    const lvl = LEVELS.find(l => l.n === n);
    if (lvl) crossed.push(lvl);
  }
  return crossed;
}

function parseSingleEntry(text) {
  const numMatch = text.match(/\d+/);
  if (!numMatch) {
    return {error: true, message: "Ingresá un número de XP y una palabra que describa la tarea. Ejemplo: +50 por lavar los platos"};
  }
  const xp = parseInt(numMatch[0], 10);
  const desc = text.replace(numMatch[0], "").replace(/^[+\-]?\s*/, "").trim();
  if (!desc) {
    return {error: true, message: "Ingresá también una palabra que describa la tarea junto al número. Ejemplo: +50 por lavar los platos"};
  }
  return {error: false, xp, desc};
}

function parseInput(rawText) {
  const texto = (rawText || "").trim();
  const cantidadNumeros = (texto.match(/\d+/g) || []).length;
  if (cantidadNumeros === 0) {
    return {error: true, message: "Ingresá un número de XP y una palabra que describa la tarea. Ejemplo: +50 por lavar los platos"};
  }
  if (cantidadNumeros > 1 && !texto.includes(",")) {
    return {error: true, message: "Parece que estás cargando más de una tarea en el mismo mensaje. Separalas con comas. Ejemplo: +50 por lavar los platos, +30 por leer 10 páginas"};
  }
  const partes = texto.split(",").map(p => p.trim()).filter(p => p.length > 0);
  const entradas = [];
  for (const parte of partes) {
    const parsed = parseSingleEntry(parte);
    if (parsed.error) return parsed;
    entradas.push(parsed);
  }
  const xpTotal = entradas.reduce((suma, e) => suma + e.xp, 0);
  return {error: false, entradas, xpTotal};
}

function procesarTurno(xpActual, textoInput) {
  const resultadoInput = parseInput(textoInput);
  if (resultadoInput.error) {
    return {error: true, message: resultadoInput.message};
  }
  const xpAntes = xpActual;
  const xpDespues = xpActual + resultadoInput.xpTotal;
  const nivelAntes = findLevelByXp(xpAntes);
  const nivelDespues = findLevelByXp(xpDespues);
  const nivelesSubidos = levelsCrossed(xpAntes, xpDespues);
  const siguienteNivel = nextLevel(nivelDespues.n);
  return {
    error: false,
    entradas: resultadoInput.entradas,
    xpGanada: resultadoInput.xpTotal,
    xpAntes, xpDespues, nivelAntes, nivelDespues, nivelesSubidos,
    subioDeNivel: nivelesSubidos.length > 0,
    faltanParaSiguiente: siguienteNivel ? siguienteNivel.xp - xpDespues : 0,
    siguienteNivel
  };
}

// ── ESTADO DE LA PARTIDA (sin persistencia todavía — tarea 5) ──
let xpTotalJugador = 0;

function renderState() {
  const nivel = findLevelByXp(xpTotalJugador);
  const sig = nextLevel(nivel.n);
  document.getElementById('state-level').textContent = 'Nivel ' + nivel.n;
  document.getElementById('state-xp').textContent = xpTotalJugador.toLocaleString('es-AR') + ' XP';
  document.getElementById('state-title').textContent = nivel.t;
  if (sig) {
    const pct = Math.min(100, Math.round(((xpTotalJugador - nivel.xp) / (sig.xp - nivel.xp)) * 100));
    document.getElementById('xp-bar-fill').style.width = pct + '%';
    document.getElementById('xp-bar-label').textContent = (sig.xp - xpTotalJugador).toLocaleString('es-AR') + ' XP para el nivel ' + sig.n;
  } else {
    document.getElementById('xp-bar-fill').style.width = '100%';
    document.getElementById('xp-bar-label').textContent = 'Nivel máximo alcanzado';
  }
}

function appendMessage(role, text) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'avatar';
  const canvas = document.createElement('canvas');
  avatarDiv.appendChild(canvas);
  if (role === 'jugador') drawJugadorAvatar(canvas); else drawValisAvatar(canvas);

  const bubbleDiv = document.createElement('div');
  bubbleDiv.className = 'bubble';
  const name = document.createElement('div');
  name.className = 'sender-name';
  name.textContent = role === 'jugador' ? 'Jugador' : 'VALIS';
  const inner = document.createElement('div');
  inner.className = 'bubble-inner';
  inner.textContent = text;

  bubbleDiv.appendChild(name);
  bubbleDiv.appendChild(inner);
  div.appendChild(avatarDiv);
  div.appendChild(bubbleDiv);
  container.appendChild(div);
  scrollToBottom();
}

function appendValisTurno(resultado) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg valis';

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'avatar';
  const canvas = document.createElement('canvas');
  drawValisAvatar(canvas);
  avatarDiv.appendChild(canvas);

  const bubbleDiv = document.createElement('div');
  bubbleDiv.className = 'bubble';
  const name = document.createElement('div');
  name.className = 'sender-name';
  name.textContent = 'VALIS';
  const inner = document.createElement('div');
  inner.className = 'bubble-inner';

  const xpLine = document.createElement('div');
  xpLine.className = 'xp-gain-text';
  xpLine.textContent = 'Sumaste +' + resultado.xpGanada + ' XP';
  inner.appendChild(xpLine);

  const fragmento = document.createElement('div');
  fragmento.className = 'fragmento-text';
  fragmento.textContent = '(fragmento narrativo pendiente — tarea 4)';
  inner.appendChild(fragmento);

  bubbleDiv.appendChild(name);
  bubbleDiv.appendChild(inner);
  div.appendChild(avatarDiv);
  div.appendChild(bubbleDiv);
  container.appendChild(div);

  if (resultado.subioDeNivel) {
    for (const lvl of resultado.nivelesSubidos) {
      appendLevelUp(lvl);
    }
  }

  scrollToBottom();
}

function appendLevelUp(lvl) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'levelup-block';
  div.innerHTML = `
    <div class="levelup-header">⚜ Ascensión — Nivel ${lvl.n}</div>
    <div class="levelup-row"><span>Título</span><span>${lvl.t}</span></div>
    <div class="levelup-row"><span>Artefacto</span><span>${lvl.art}</span></div>
    <div class="levelup-row"><span>Contraseña</span><span class="pw">${lvl.pw}</span></div>
  `;
  container.appendChild(div);
  scrollToBottom();
}

function appendError(message) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'error-block';
  div.textContent = message;
  container.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.remove();

  appendMessage('jugador', text);
  input.value = '';
  updateCharCount();

  const resultado = procesarTurno(xpTotalJugador, text);

  if (resultado.error) {
    appendError(resultado.message);
    return;
  }

  xpTotalJugador = resultado.xpDespues;
  appendValisTurno(resultado);
  renderState();
}

document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('user-input').addEventListener('input', function() {
  updateCharCount();
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function updateCharCount() {
  const len = document.getElementById('user-input').value.length;
  document.getElementById('char-count').textContent = len + ' caracteres';
}

renderState();

</script>
</body>
</html>
